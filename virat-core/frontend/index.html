<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIRAT | Digital Ecosystem</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d1b;color:#f5f7ff;font-family:Arial,sans-serif}
header{padding:24px 18px;background:linear-gradient(120deg,#171b40,#102e40);border-bottom:1px solid #343b61}
h1{margin:0;color:#a99bff;font-size:28px}
header p{color:#c2c8e8}
main{padding:20px;max-width:1100px;margin:auto}
#status{color:#65e6b1;margin-bottom:18px}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:13px}
.panel{background:#131a2c;border:1px solid #303b59;border-radius:14px;padding:19px 13px;min-height:95px}
.panel strong{display:block;margin-bottom:9px}
.panel small{color:#9daac9}
</style>
</head>
<body>
<header>
<h1>VIRAT</h1>
<p>Digital Ecosystem · One Platform. Endless Possibilities.</p>
</header>
<main>
<h2>Explore Services</h2>
<div id="status">Connecting to VIRAT backend...</div>
<div style="margin:18px 0;display:flex;gap:8px">
<input id="vsearch" type="search" placeholder="Search the web with VIRAT..." style="flex:1;min-width:0;padding:14px;border-radius:10px;border:1px solid #303b59;background:#131a2c;color:white">
<button id="vsearchbtn" style="padding:12px;border:0;border-radius:10px;background:#8b7cff;color:white;font-weight:bold">Search</button>
</div>
<section style="margin:22px 0;padding:18px;border:1px solid #303b59;border-radius:14px;background:#131a2c">
<h2 style="margin-top:0;color:#a99bff">VIRAT AI</h2>
<p style="color:#aeb9d5">Ask a question to prepare your prompt.</p>
<textarea id="aiquestion" rows="3" placeholder="Type your question..." style="width:100%;box-sizing:border-box;padding:13px;border-radius:10px;background:#090d1b;color:white;border:1px solid #303b59"></textarea>
<button id="aibtn" style="margin-top:10px;padding:12px 18px;border:0;border-radius:9px;background:#8b7cff;color:white;font-weight:bold">Ask VIRAT AI</button>
<p id="airesult" style="white-space:pre-wrap;color:#c8d0ea"></p>
</section>

<section style="margin:22px 0;padding:18px;border:1px solid #303b59;border-radius:14px;background:#131a2c">
<h2 style="color:#65e6b1;margin-top:0">INSTANT PAY</h2>
<p style="color:#aeb9d5">Secure payment demo — no real money is transferred.</p>
<label for="payamount">Amount (₹)</label>
<input id="payamount" type="number" min="1" max="100000" placeholder="Enter amount" style="display:block;width:100%;box-sizing:border-box;margin:8px 0 12px;padding:13px;border-radius:9px;background:#090d1b;color:white;border:1px solid #303b59">
<label for="paynote">Payment note</label>
<input id="paynote" maxlength="100" placeholder="What is this payment for?" style="display:block;width:100%;box-sizing:border-box;margin:8px 0 12px;padding:13px;border-radius:9px;background:#090d1b;color:white;border:1px solid #303b59">
<button id="paydemo" style="padding:12px 18px;border:0;border-radius:9px;background:#65e6b1;color:#08131b;font-weight:bold">Preview Demo</button>
<p id="payresult" style="white-space:pre-wrap;color:#c8d0ea"></p>
</section>
<div id="grid"></div>
</main>
<script>
fetch('modules.json')
.then(r=>r.json())
.then(data=>{
document.getElementById('status').textContent=data.count+' services listed · Backend connected';
document.getElementById('grid').innerHTML=data.modules.map(m=>
'<div class="panel"><strong>'+m.name+'</strong><small>'+m.status+'</small></div>'
).join('');
})
.catch(()=>{
document.getElementById('status').textContent='Backend not connected. Start the API on port 3001.';
});
document.getElementById('vsearchbtn').addEventListener('click',()=>{
 const q=document.getElementById('vsearch').value.trim();
 if(q) window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank');
});
document.getElementById('vsearch').addEventListener('keydown',e=>{
 if(e.key==='Enter') document.getElementById('vsearchbtn').click();
});

document.getElementById('aibtn')?.addEventListener('click',()=>{
 const q=document.getElementById('aiquestion').value.trim();
 document.getElementById('airesult').textContent=q
 ? 'Your prompt is ready. AI answers are not connected yet.\n\nQuestion: '+q
 : 'Please type a question first.';
});
\n
document.getElementById('paydemo')?.addEventListener('click',()=>{
 const amount=Number(document.getElementById('payamount').value);
 const note=document.getElementById('paynote').value.trim();
 const out=document.getElementById('payresult');
 if(!Number.isFinite(amount)||amount<=0){out.textContent='Please enter a valid amount.';return;}
 out.textContent='DEMO PREVIEW ONLY\\nAmount: ₹'+amount.toFixed(2)+'\\nNote: '+(note||'No note')+'\\nNo payment was made.';
});
\n</script>
</body>
</html>
