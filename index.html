<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>AI Fusion | India's AI Powerhouse</title>
<style>
:root {
  --saffron: #ff9933;
  --white: #ffffff;
  --green: #138808;
  --navy: #07111f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  min-height: 100vh;
  color: white;
  font-family: Arial, sans-serif;
  background: var(--navy);
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  background:
    linear-gradient(to bottom,
      rgba(255,153,51,.20),
      rgba(255,255,255,.035) 48%,
      rgba(19,136,8,.20)),
    radial-gradient(ellipse at 50% 45%,
      #173456 0%, #07111f 70%);
}
header {
  min-height: 76px;
  padding: 18px 7%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px solid rgba(255,255,255,.14);
  background: rgba(4,10,20,.75);
}
.logo {
  font-size: 23px;
  font-weight: 900;
  letter-spacing: 2px;
}
.logo span {
  background: linear-gradient(90deg,#ff9933,#fff,#138808);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.tag {
  font-size: 11px;
  color: #d8e4f2;
  letter-spacing: 2px;
}
.hero {
  width: min(1100px, 100%);
  min-height: calc(100vh - 140px);
  margin: auto;
  padding: 55px 22px 45px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.eyebrow {
  padding: 9px 15px;
  border: 1px solid rgba(255,153,51,.55);
  border-radius: 30px;
  color: #ffd0a0;
  font-size: 11px;
  letter-spacing: 2px;
  margin-bottom: 23px;
}
h1 {
  max-width: 850px;
  font-size: clamp(36px, 8vw, 76px);
  line-height: 1.08;
  font-weight: 900;
  letter-spacing: -2px;
}
h1 span {
  background: linear-gradient(90deg,#ff9933 5%,#fff 50%,#6ee777 95%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.description {
  max-width: 620px;
  margin-top: 20px;
  color: #c4d0df;
  font-size: 16px;
  line-height: 1.8;
}
.chakra-stage {
  width: 220px;
  height: 220px;
  display: grid;
  place-items: center;
  margin: 32px auto;
  position: relative;
}
.chakra {
  width: 190px;
  height: 190px;
  border: 5px solid #4aa4ff;
  border-radius: 50%;
  position: relative;
  background:
    repeating-conic-gradient(
      from 0deg,
      #4aa4ff 0deg 1.2deg,
      transparent 1.2deg 15deg
    );
  box-shadow: 0 0 24px #1685ff66,
              inset 0 0 22px #1685ff33;
  animation: chakra-spin 24s linear infinite;
}
.chakra::before {
  content: "";
  position: absolute;
  inset: 10px;
  border: 2px solid #4aa4ff;
  border-radius: 50%;
  background: var(--navy);
}
.chakra::after {
  content: "";
  position: absolute;
  width: 14px;
  height: 14px;
  border: 3px solid #4aa4ff;
  border-radius: 50%;
  background: white;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
}
@keyframes chakra-spin {
  to { transform: rotate(360deg); }
}
.buttons {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 14px;
}
.btn {
  display: inline-block;
  padding: 14px 25px;
  border-radius: 9px;
  text-decoration: none;
  font-weight: bold;
  font-size: 14px;
}
.btn-primary {
  color: #111827;
  background: linear-gradient(110deg,#ff9933,#fff 52%,#8de18a);
  box-shadow: 0 7px 25px #ff993322;
}
.btn-secondary {
  color: white;
  border: 1px solid #8095af;
  background: #ffffff08;
}
footer {
  padding: 22px 12px;
  text-align: center;
  color: #93a5bb;
  font-size: 12px;
  border-top: 1px solid #ffffff18;
}
footer span { color: #ffb66f; }
@media (max-width: 500px) {
  header { padding: 17px 5%; }
  .logo { font-size: 19px; }
  .tag { font-size: 9px; letter-spacing: 1px; }
  .hero { padding-top: 42px; }
  .chakra-stage { margin: 25px auto; }
  .description { font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>
<header>
  <div class="logo"><span>AI FUSION</span></div>
  <div class="tag">MADE WITH INDIAN SPIRIT</div>
</header>

<main class="hero">
  <div class="eyebrow">✦ EMPOWERING INDIA WITH AI FUSION ✦</div>
  <h1>The Future of<br><span>Indian Innovation</span></h1>
  <p class="description">
    Technology inspired by India. A new digital experience
    built around creativity, intelligence and innovation.
  </p>

  <div class="chakra-stage" aria-label="Rotating Ashoka Chakra">
    <div class="chakra"></div>
  </div>

  <div class="buttons">
    <a class="btn btn-primary" href="#about">EXPLORE AI FUSION ↗</a>
    <a class="btn btn-secondary" href="https://github.com/abhiprin6-gif/ai-fusion">VIEW ON GITHUB</a>
  </div>
</main>

<footer id="about">
  <span>जय हिन्द 🇮🇳</span> · © 2026 AI Fusion · Built in India
</footer>
</body>
</html>
